<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFIOSO-STORE Montepuez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f0f;color:#fff;font-family:Arial}
.top{background:#111;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:20}
.url{flex:1;background:#2a2a2a;border-radius:20px;padding:8px 12px;font-size:11px}
.banner{background:#ff0040;padding:12px;display:flex;gap:8px}
.bleft{flex:1}
.bleft h1{background:#fff;color:#ff0040;padding:4px 8px;font-size:13px;font-weight:900;border-radius:4px;display:inline-block}
.coupon{background:#fff;color:#000;border-radius:10px;padding:6px;text-align:center;min-width:75px}
.coupon b{color:#ff0040}
.cats{display:flex;gap:10px;padding:12px;background:#1a1a1a;overflow-x:auto}
.cats::-webkit-scrollbar{display:none}
.cat{min-width:65px;text-align:center;font-size:9px;color:#ccc;flex-shrink:0;cursor:pointer}
.ico{width:48px;height:48px;background:#2a2a2a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 4px}
.sec{padding:12px;margin-top:8px}
.sec h2{border-left:4px solid #ff0040;padding-left:8px;margin-bottom:10px;font-size:18px}
.grid{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.grid::-webkit-scrollbar{display:none}
.card{min-width:165px;max-width:165px;background:#1e1e1e;border-radius:14px;overflow:hidden;border:1px solid #333;flex-shrink:0}
.img{height:160px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;font-size:60px;position:relative}
.badge{position:absolute;top:6px;left:6px;background:#ff0040;color:#fff;font-size:8px;padding:4px 7px;border-radius:8px;font-weight:bold}
.card h3{font-size:12px;padding:8px;height:38px;overflow:hidden}
.preco{color:#ff2d55;font-weight:800;padding:0 8px;font-size:15px}
.old{color:#777;font-size:11px;text-decoration:line-through;padding:0 8px 6px}
.btn{width:92%;margin:6px 4%;background:#ff0040;color:#fff;border:none;border-radius:20px;padding:10px;font-weight:bold;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333;max-width:430px;margin:0 auto;z-index:30}
.nav div{text-align:center;font-size:10px;color:#888;cursor:pointer}
.nav .ativo{color:#ff0040}
.app{max-width:430px;margin:0 auto;padding-bottom:90px;min-height:100vh}
.cart-badge{position:absolute;top:-6px;right:6px;background:#ff0040;color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;display:none;align-items:center;justify-content:center}
#adminPanel{position:fixed;inset:0;background:#0a0a0a;z-index:999;display:none;overflow:auto}
.adminHead{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333}
.adminCard{background:#1e1e1e;margin:10px;border-radius:14px;padding:14px;border:1px solid #333}
.inp{width:100%;padding:12px;border:1px solid #333;border-radius:10px;margin-bottom:8px;background:#2a2a2a;color:#fff}
.btnAdmin{width:100%;background:#fff;color:#111;border:none;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;margin-top:6px}
.btnGreen{background:#00c853!important;color:#fff!important}
.catWrap{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.catWrap::-webkit-scrollbar{display:none}
.catBtn{padding:10px 16px;border-radius:20px;border:2px solid #333;background:#2a2a2a;color:#fff;font-size:12px;font-weight:bold;white-space:nowrap;flex-shrink:0;cursor:pointer}
.catBtn.active{background:#ff0040;border-color:#ff0040}
.previewWrap{display:flex;gap:8px;flex-wrap:wrap}
.previewBox{width:70px;height:70px;border-radius:10px;overflow:hidden;background:#2a2a2a;border:1px solid #333}
.previewBox img{width:100%;height:100%;object-fit:cover}
.adminItem{display:flex;gap:10px;background:#2a2a2a;border-radius:10px;padding:8px;align-items:center;margin-bottom:6px}
.btnS{padding:6px 10px;border-radius:8px;border:none;font-size:11px;cursor:pointer}
.del{background:#ff0040;color:#fff}
.edit{background:#fff;color:#111}
.loginBox{max-width:320px;margin:80px auto;background:#1e1e1e;padding:24px;border-radius:16px;text-align:center;border:1px solid #333}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>🏠</span><div class="url">🔒 mafioso-store.mz • 871585269</div><span>78</span></div>
<div class="banner"><div class="bleft"><h1>MAFIOSO-STORE</h1><p style="font-size:11px">MONTEPUEZ - HORIZONTAL</p></div><div class="coupon"><b>-500 MT</b></div><div class="coupon"><b>-1000 MT</b></div></div>
<div class="cats">
<div class="cat" onclick="filterCat('all')"><div class="ico">👑</div>TODOS</div>

<div class="cat" onclick="filterCat('CALCINHAS')"><div class="ico">🩲</div>CALCINHAS</div>
<div class="cat" onclick="filterCat('CALÇÕES')"><div class="ico">🩳</div>CALÇÕES</div>
<div class="cat" onclick="filterCat('BOXER')"><div class="ico">🩲</div>BOXER</div>
<div class="cat" onclick="filterCat('CAMISA')"><div class="ico">👕</div>CAMISA</div>
<div class="cat" onclick="filterCat('COLAR')"><div class="ico">📿</div>COLAR</div>
<div class="cat" onclick="filterCat('BIQUINI')"><div class="ico">👙</div>BIQUINI</div>
</div>
<div id="allSections"></div>
</div>
<div class="nav">
<div class="ativo">🏠<br>TODOS</div>
<div onclick="openCart()"><span>🛒</span><br>Panier<span id="cartBadge" class="cart-badge">0</span></div>
<div onclick="abrirWhats()" style="color:#25D366">💬<br>WhatsApp</div>
<div onclick="abrirAdmin()" style="color:#ff0040">⚙️<br>Admin</div>
</div>
