<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAFIOSO-STORE Montepuez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#0f0f0f;color:#fff}
.top{background:#111;padding:10px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:20;border-bottom:1px solid #222}
.url{flex:1;background:#2a2a2a;border-radius:20px;padding:8px 12px;font-size:11px;white-space:nowrap;overflow:hidden}
.banner{background:#ff0040;padding:12px;display:flex;gap:8px}
.bleft{flex:1}
.bleft h1{background:#fff;color:#ff0040;padding:3px 8px;font-size:13px;display:inline-block;font-weight:900;border-radius:4px}
.coupon{background:#fff;color:#000;border-radius:10px;padding:6px;text-align:center;min-width:75px}
.coupon b{color:#ff0040;font-size:13px}
.cats{display:flex;gap:10px;padding:12px;background:#1a1a1a;overflow-x:auto;white-space:nowrap}
.cats::-webkit-scrollbar{display:none}
.cat{text-align:center;font-size:9px;min-width:62px;color:#ccc;flex-shrink:0}
.ico{width:48px;height:48px;border-radius:14px;margin:auto;display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:4px;background:#2a2a2a}
.sec{background:#0f0f0f;margin-top:8px;padding:12px}
.sec h2{font-size:18px;margin-bottom:10px;color:#fff;border-left:4px solid #ff0040;padding-left:8px}
.grid{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;flex-wrap:nowrap}
.grid::-webkit-scrollbar{display:none}
.card{min-width:160px;max-width:160px;background:#1e1e1e;border-radius:14px;overflow:hidden;border:1px solid #333;position:relative;flex-shrink:0}
.img{height:155px;background:#2a2a2a;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.img img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:11px;padding:8px 8px 2px;height:36px;overflow:hidden;color:#fff}
.preco{color:#ff2d55;font-weight:800;padding:0 8px;font-size:14px}
.old{color:#777;font-size:11px;text-decoration:line-through;padding:0 8px 4px}
.btn{width:92%;margin:6px 4%;background:#ff0040;color:#fff;border:none;border-radius:20px;padding:9px;font-size:11px;font-weight:bold;cursor:pointer}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:10px 0;border-top:1px solid #333;max-width:430px;margin:auto;z-index:30}
.nav div{text-align:center;font-size:10px;color:#888;cursor:pointer;position:relative}
.nav .ativo{color:#ff0040}
.app{max-width:430px;margin:auto;background:#0f0f0f;min-height:100vh;padding-bottom:90px}
.cart-badge{position:absolute;top:-8px;right:8px;background:#ff0040;color:#fff;width:16px;height:16px;border-radius:50%;font-size:9px;display:none;align-items:center;justify-content:center}
.badge{position:absolute;top:6px;left:6px;background:#ff0040;color:#fff;font-size:8px;padding:4px 7px;border-radius:8px;font-weight:bold;z-index:2}
#adminPanel{position:fixed;inset:0;background:#0a0a0a;z-index:100;display:none;overflow:auto}
.adminHead{background:#111;padding:14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #333;position:sticky;top:0}
.adminCard{background:#1e1e1e;margin:10px;border-radius:14px;padding:14px;border:1px solid #333}
.inp{width:100%;padding:12px;border:1px solid #333;border-radius:10px;margin-bottom:8px;font-size:14px;background:#2a2a2a;color:#fff}
.btnAdmin{width:100%;background:#fff;color:#111;border:none;border-radius:10px;padding:12px;font-weight:bold;cursor:pointer;margin-top:6px}
.btnGreen{background:#00c853;color:#fff!important}
.previewWrap{display:flex;gap:8px;flex-wrap:wrap}
.previewBox{width:70px;height:70px;border-radius:10px;overflow:hidden;position:relative;background:#2a2a2a;border:1px solid #333}
.previewBox img{width:100%;height:100%;object-fit:cover}
.prodItemAdmin{display:flex;gap:10px;background:#2a2a2a;border-radius:10px;padding:8px;align-items:center;margin-bottom:6px}
.prodItemAdmin img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.btnS{padding:6px 10px;border-radius:8px;border:none;font-size:11px;cursor:pointer;margin:2px}
.del{background:#ff0040;color:#fff}
.edit{background:#fff;color:#111}
.loginBox{max-width:320px;margin:80px auto;background:#1e1e1e;padding:24px;border-radius:16px;text-align:center;border:1px solid #333}
.errorMsg{background:#ff004033;border:1px solid #ff0040;color:#ff4d6d;padding:10px;border-radius:10px;font-size:13px;margin:10px 0;display:none}
.waBtn{background:#25D366!important;color:#fff!important}
</style>
</head>
<body>
<div class="app">
<div class="top">
<span>🏠</span>
<div class="url">🔒 mafioso-store.mz • Montepuez • 871585269</div>
<span>78</span>
</div>
<div class="banner">
<div class="bleft">
<h1>MAFIOSO-STORE</h1>
<p style="font-size:11px">CALÇAS • CALCINHAS • BOXER • CAMISAS</p>
</div>
<div class="coupon"><b>-500 MT</b></div>
<div class="coupon"><b>-1000 MT</b></div>
</div>
<div class="cats">
<div class="cat" onclick="filterCat('all')"><div class="ico">👑</div>TODOS</div>
<div class="cat" onclick="filterCat('CALÇAS')"><div class="ico">👖</div>CALÇAS</div>
<div class="cat" onclick="filterCat('CALCINHAS')"><div class="ico">🩲</div>CALCINHAS</div>
<div class="cat" onclick="filterCat('CALÇÕES')"><div class="ico">🩳</div>CALÇÕES</div>
<div class="cat" onclick="filterCat('BOXER')"><div class="ico">🩲</div>BOXER</div>
<div class="cat" onclick="filterCat('CAMISA')"><div class="ico">👕</div>CAMISA</div>
<div class="cat" onclick="filterCat('CAMISA MANGA COMPRIDA')"><div class="ico">👔</div>M/COMPRIDA</div>
<div class="cat" onclick="filterCat('COLAR')"><div class="ico">📿</div>COLAR</div>
<div class="cat" onclick="filterCat('COLARES')"><div class="ico">📿</div>COLARES</div>
<div class="cat" onclick="filterCat('BIQUINI')"><div class="ico">👙</div>BIQUINI</div>
<div class="cat" onclick="filterCat('VESTIDOS')"><div class="ico">👗</div>VESTIDOS</div>
</div>
<div id="allSections"></div>
</div>
<div style="display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin:6px 0">
<button type="button" class="catBtn" onclick="setCat('CALÇAS')" id="btn-CALÇAS">👖 CALÇAS</button>
<button type="button" class="catBtn" onclick="setCat('CALCINHAS')" id="btn-CALCINHAS">🩲 CALCINHAS</button>
<button type="button" class="catBtn" onclick="setCat('CALÇÕES')" id="btn-CALÇÕES">🩳 CALÇÕES</button>
<button type="button" class="catBtn" onclick="setCat('COLAR')" id="btn-COLAR">📿 COLAR</button>
<button type="button" class="catBtn" onclick="setCat('COLARES')" id="btn-COLARES">📿 COLARES</button>
<button type="button" class="catBtn" onclick="setCat('CAMISA')" id="btn-CAMISA">👕 CAMISA</button>
<button type="button" class="catBtn" onclick="setCat('CAMISA MANGA COMPRIDA')" id="btn-CAMISA MANGA COMPRIDA">👔 M/COMPRIDA</button>
<button type="button" class="catBtn" onclick="setCat('BOXER')" id="btn-BOXER">🩲 BOXER</button>
<button type="button" class="catBtn" onclick="setCat('BIQUINI')" id="btn-BIQUINI">👙 BIQUINI</button>
<button type="button" class="catBtn" onclick="setCat('VESTIDOS')" id="btn-VESTIDOS">👗 VESTIDOS</button>
</div>
<input type="hidden" id="pCat" value="CALÇAS">
<div id="catSelected" style="background:#ff0040;color:#fff;padding:8px;border-radius:8px;text-align:center;font-weight:bold;margin-bottom:8px">👖 CALÇAS selecionada</div>
<style>
.catBtn{padding:10px 14px;border-radius:20px;border:2px solid #333;background:#2a2a2a;color:#fff;font-size:12px;font-weight:bold;white-space:nowrap;flex-shrink:0;cursor:pointer}
.catBtn.active{background:#ff0040;border-color:#ff0040;color:#fff}
</style>
<script>
let selectedCat='CALÇAS';
function setCat(c){
selectedCat=c;
document.getElementById('pCat').value=c;
document.getElementById('catSelected').innerText='✅ '+c+' selecionada';
document.querySelectorAll('.catBtn').forEach(b=>b.classList.remove('active'));
const btn=document.getElementById('btn-'+c);
if(btn)btn.classList.add('active');
}
</script>
