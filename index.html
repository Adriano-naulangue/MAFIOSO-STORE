<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>MAFIOSO-STORE Montepuez</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial}
.top{position:sticky;top:0;z-index:20;background:#111;padding:10px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #222}
.url{flex:1;background:#232323;border-radius:20px;padding:8px 14px;font-size:12px}
.sec{padding:14px 0 14px 12px}
.sec h2{font-size:15px;margin-bottom:10px;padding-left:8px;border-left:4px solid #ff0040}
.grid{display:flex;gap:12px;overflow-x:auto;padding-right:12px;padding-bottom:6px}
.grid::-webkit-scrollbar{display:none}
.card{min-width:168px;max-width:168px;background:#1a1a1a;border-radius:14px;overflow:hidden;border:1px solid #2a2a2a;flex-shrink:0;position:relative}
.badge{position:absolute;top:8px;left:8px;background:#ff0040;color:#fff;font-size:8px;font-weight:900;padding:4px 8px;border-radius:12px;z-index:2}
.img{height:170px;background:#ddd;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.img img{width:100%;height:100%;object-fit:cover}
.card h3{font-size:12px;padding:8px 8px 4px;height:32px;overflow:hidden}
.preco{color:#ff0040;font-weight:900;padding:0 8px;font-size:15px}
.old{color:#888;font-size:11px;text-decoration:line-through;padding:0 8px 6px}
.btnAdd{width:92%;margin:6px 4% 10px;background:#ff0040;color:#fff;border:none;border-radius:20px;padding:10px;font-weight:bold;font-size:12px}
#productModal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:200;display:none}
.modalContent{max-width:430px;margin:0 auto;background:#111;min-height:100vh}
.modalImgWrap{height:75vh;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.modalImgWrap img{max-width:100%;max-height:100%;object-fit:contain;transition:transform 0.3s}
.modalImgWrap img.zoomed{transform:scale(2.5)}
.closeModal{position:absolute;top:12px;right:12px;background:#fff;color:#111;border:none;width:36px;height:36px;border-radius:50%;font-size:18px;font-weight:bold}
.modalInfo{padding:16px}
.modalBtns{display:flex;gap:10px;margin-top:14px}
.btnWhats{flex:1;background:#25D366;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:bold}
.btnCart{flex:1;background:#ff0040;color:#fff;border:none;border-radius:12px;padding:14px;font-weight:bold}
.nav{position:fixed;bottom:0;left:0;right:0;background:#111;display:flex;justify-content:space-around;padding:8px 0 10px;border-top:1px solid #222;max-width:430px;margin:0 auto;z-index:30}
.app{max-width:430px;margin:0 auto;padding-bottom:70px}
#adminPanel{position:fixed;inset:0;background:#0a0a0a;z-index:300;display:none;overflow:auto}
.adminHead{background:#111;padding:14px;display:flex;justify-content:space-between;position:sticky;top:0}
.adminCard{background:#1e1e1e;margin:10px;border-radius:14px;padding:14px;border:1px solid #333}
.inp{width:100%;padding:12px;border:1px solid #333;border-radius:10px;margin-bottom:8px;background:#2a2a2a;color:#fff}
.btnAdmin{width:100%;background:#00c853;color:#fff;border:none;border-radius:10px;padding:12px;font-weight:bold;margin-top:6px}
.loginBox{max-width:320px;margin:80px auto;background:#1e1e1e;padding:24px;border-radius:16px;text-align:center}
.previewWrap{display:flex;gap:8px;flex-wrap:wrap}
.previewBox{width:70px;height:70px;border-radius:10px;overflow:hidden;background:#2a2a2a;border:2px solid #00c853}
.previewBox img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div class="app">
<div class="top"><span>🏠</span><div class="url">🔒 mafioso-store.mz • Montepuez • 871585269</div><span>78</span></div>
<div id="allSections"></div>
<div style="text-align:center;padding:20px 12px;color:#555;font-size:11px">Admin: <u onclick="abrirAdmin()" style="color:#ff0040">clique aqui</u> • WhatsApp 871585269</div>
</div>
<div class="nav">
<div style="color:#ff0040">🏠<br>Accueil</div>
<div>🔍<br>Catégorie</div>
<div>🛒<br>Panier <span id="cartCount" style="background:#ff0040;color:#fff;border-radius:50%;padding:2px 6px;font-size:9px;display:none">0</span></div>
<div onclick="abrirAdmin()">👤<br>Compte</div>
</div>
<div id="productModal" onclick="if(event.target===this) fecharModal()">
<div class="modalContent">
<div class="modalImgWrap"><button class="closeModal" onclick="fecharModal()">✕</button><img id="modalImg" src="" onclick="this.classList.toggle('zoomed')"></div>
<div class="modalInfo"><h2 id="modalNome"></h2><div class="preco" id="modalPreco"></div><div class="old" id="modalOld"></div><p style="font-size:12px;color:#aaa;margin-top:10px">📍 Montepuez - Toque na imagem para ampliar</p><div class="modalBtns"><button class="btnCart" onclick="adicionarDoModal()">🛒 Adicionar</button><button class="btnWhats" onclick="comprarWhatsModal()">💬 WhatsApp</button></div></div>
</div>
</div>
<div id="adminPanel"><div class="adminHead"><h2>ADMIN AUTOMÁTICO</h2><button onclick="fecharAdmin()" style="background:#fff;color:#111;border:none;border-radius:8px;padding:8px 16px;font-weight:bold">X</button></div><div id="loginDiv" class="loginBox"><h3>🔒 Acesso</h3><input id="passInput" type="password" class="inp" placeholder="Digite sua senha"><button class="btnAdmin" onclick="fazerLogin()">ENTRAR</button></div><div id="adminContent" style="display:none"><div class="adminCard"><h3>➕ Publicar na Horizontal</h3><input type="file" id="fileInput" accept="image/*" multiple class="inp"><div id="previewWrap" class="previewWrap"></div><div id="statusMsg" style="padding:8px;border-radius:8px;margin:6px 0;text-align:center;font-size:12px;display:none"></div><input id="pNome" class="inp" placeholder="Nome: ex Montre Connectée Sport"><input id="pPreco" class="inp" type="number" placeholder="Preço atual: ex 2450"><input id="pOld" class="inp" type="number" placeholder="Preço antigo: ex 4000"><button id="btnPublicar" class="btnAdmin" onclick="publicarAuto()">📤 PUBLICAR AUTOMATICAMENTE NA HORIZONTAL</button></div><div class="adminCard"><h3>📦 Produtos (<span id="countProd">0</span>)</h3><div id="adminList"></div><button class="btnAdmin" style="background:#ff0040" onclick="resetar()">🗑️ Resetar</button></div></div></div>
<script>
var products = JSON.parse(localStorage.getItem('mafioso_v9_horizontal')||'null');
if(!products){products=[{n:"Montre Connectée Sport",p:2450,o:4000,emoji:"⌚",cat:"Delgados"},{n:"Sac à Dos Voyage",p:1629,o:2500,emoji:"🎒",cat:"Delgados"},{n:"Clavier RGB + Souris",p:2849,o:4200,emoji:"⌨️",cat:"More to love - Montepuez"}];}
var cart = JSON.parse(localStorage.getItem('mafioso_cart_v9')||'[]');var curImgs=[];var modalIndex=0;
function salvar(){localStorage.setItem('mafioso_v9_horizontal',JSON.stringify(products));}
function salvarCart(){localStorage.setItem('mafioso_cart_v9',JSON.stringify(cart));atualizarCart();}
function render(){
var container=document.getElementById('allSections');container.innerHTML='';
var grupos={};products.forEach(function(pr,idx){if(!grupos[pr.cat])grupos[pr.cat]=[];grupos[pr.cat].push({pr:pr,idx:idx});});
Object.keys(grupos).forEach(function(cat){
var html='<div class="sec"><h2>'+cat+'</h2><div class="grid">';
grupos[cat].forEach(function(item){
var pr=item.pr;var imgContent=pr.img?'<img src="'+pr.img+'" loading="lazy">':'<span style="color:#999;font-weight:bold">Foto</span>';
html+='<div class="card"><span class="badge">MONTEPUEZ</span><div class="img" onclick="abrirModal('+item.idx+')">'+imgContent+'</div><h3>'+pr.n+'</h3><div class="preco">'+pr.p+' MT</div><div class="old">'+(pr.o?pr.o+' MT':'')+'</div><button class="btnAdd" onclick="adicionar('+item.idx+')">Adicionar</button></div>';
});html+='</div></div>';container.innerHTML+=html;
});
document.getElementById('countProd').innerText=products.length;
var list=document.getElementById('adminList');list.innerHTML='';
products.forEach(function(pr,i){
var thumb=pr.img?'<img src="'+pr.img+'" style="width:50px;height:50px;object-fit:cover;border-radius:8px">':'<div style="font-size:28px;width:50px;text-align:center">'+pr.emoji+'</div>';
list.innerHTML+='<div style="display:flex;gap:8px;background:#2a2a2a;border-radius:10px;padding:8px;align-items:center;margin-bottom:6px">'+thumb+'<div style="flex:1"><b style="font-size:11px">'+pr.n+'</b><br><span style="color:#ff2d55;font-size:11px">'+pr.p+' MT</span></div><button onclick="apagar('+i+')" style="background:#ff0040;color:#fff;border:none;border-radius:6px;padding:6px 10px">X</button></div>';
});
}
function abrirModal(i){modalIndex=i;var pr=products[i];document.getElementById('modalImg').src=pr.img||'';document.getElementById('modalImg').classList.remove('zoomed');document.getElementById('modalNome').innerText=pr.n;document.getElementById('modalPreco').innerText=pr.p+' MT';document.getElementById('modalOld').innerText=pr.o?pr.o+' MT':'';document.getElementById('productModal').style.display='block';document.body.style.overflow='hidden';}
function fecharModal(){document.getElementById('productModal').style.display='none';document.body.style.overflow='';}
function adicionar(i){cart.push(products[i]);salvarCart();alert('✅ '+products[i].n+' adicionado!');}
function adicionarDoModal(){adicionar(modalIndex);fecharModal();}
function comprarWhatsModal(){var pr=products[modalIndex];var txt='Olá MAFIOSO-STORE Montepuez! Quero: '+pr.n+' - '+pr.p+' MT';window.open('https://wa.me/258871585269?text='+encodeURIComponent(txt),'_blank');}
function abrirCart(){if(cart.length===0){alert('Panier vazio!');return;}var txt='Olá MAFIOSO-STORE! Quero pedir:%0A%0A';var tot=0;cart.forEach(function(p,i){txt+=(i+1)+'. '+p.n+' - '+p.p+' MT%0A';tot+=p.p;});txt+='%0ATotal: '+tot+' MT';window.open('https://wa.me/258871585269?text='+encodeURIComponent(txt),'_blank');}
function atualizarCart(){var el=document.getElementById('cartCount');if(cart.length>0){el.style.display='inline';el.innerText=cart.length;}else{el.style.display='none';}}
function abrirAdmin(){document.getElementById('adminPanel').style.display='block';}
function fecharAdmin(){document.getElementById('adminPanel').style.display='none';}
function fazerLogin(){var s=document.getElementById('passInput').value;var k='bWFmaW9zbzIwMjU=';if(btoa(s)===k){document.getElementById('loginDiv').style.display='none';document.getElementById('adminContent').style.display='block';}else{alert('Senha errada!');}}
function mostrarStatus(msg,ok){var el=document.getElementById('statusMsg');el.innerText=msg;el.style.display='block';el.style.background=ok?'#00c853':'#ff0040';el.style.color='#fff';setTimeout(function(){el.style.display='none';},2500);}
function comprimirImagem(file,cb){var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var c=document.createElement('canvas');var MAX=800;var w=img.width,h=img.height;if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.75));};img.src=e.target.result;};r.readAsDataURL(file);}
document.getElementById('fileInput').addEventListener('change',function(e){var files=Array.from(e.target.files);curImgs=[];var wrap=document.getElementById('previewWrap');wrap.innerHTML='';var loaded=0;mostrarStatus('⏳ Comprimindo '+files.length+' foto(s)...',true);files.forEach(function(f){comprimirImagem(f,function(url){curImgs.push(url);var d=document.createElement('div');d.className='previewBox';d.innerHTML='<img src="'+url+'">';wrap.appendChild(d);loaded++;if(loaded===files.length){mostrarStatus('✅ '+loaded+' pronta(s)!',true);}});});});
function publicarAuto(){var nome=document.getElementById('pNome').value.trim()||'Produto Montepuez';var p=parseInt(document.getElementById('pPreco').value);var o=parseInt(document.getElementById('pOld').value)||Math.round(p*1.6);if(!p){mostrarStatus('❌ Digita preço!',false);return;}if(curImgs.length===0){mostrarStatus('❌ Escolhe foto!',false);return;}var btn=document.getElementById('btnPublicar');btn.innerText='⏳ PUBLICANDO...';btn.disabled=true;setTimeout(function(){var qtd=curImgs.length;curImgs.forEach(function(img,i){var n=qtd>1?nome+' '+(i+1):nome;products.unshift({n:n,p:p,o:o,img:img,emoji:'👕',cat:'Delgados'});});salvar();render();document.getElementById('pNome').value='';document.getElementById('pPreco').value='';document.getElementById('pOld').value='';curImgs=[];document.getElementById('previewWrap').innerHTML='';document.getElementById('fileInput').value='';mostrarStatus('✅ '+qtd+' publicado(s)!',true);alert('✅ '+qtd+' produto(s) na horizontal!');fecharAdmin();btn.innerText='📤 PUBLICAR AUTOMATICAMENTE NA HORIZONTAL';btn.disabled=false;},300);}
function apagar(i){if(confirm('Apagar '+products[i].n+'?')){products.splice(i,1);salvar();render();}}
function resetar(){if(confirm('Resetar tudo?')){localStorage.removeItem('mafioso_v9_horizontal');location.reload();}}
render();atualizarCart();
</script>
</body>
</html>
